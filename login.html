<!DOCTYPE html>
<html>
<head>
  <title>Login — CineWave</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container" align="center">
    <div class="auth-bg">
      <h1 class="logo">CineWave</h1>
      <p>Your world of cinema — in one place.</p>
    </div>
  </div>

  <div class="auth-card">
    <h2>Sign In</h2>

    <form onsubmit="alert('Demo login success ✔️'); return false;">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button>Login</button>
    </form>

    <p>New here? <a href="signup.html">Create account</a></p>
  </div>
  <script src="login.js"></script>

</body>
</html>
